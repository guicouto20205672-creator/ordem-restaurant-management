<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101a18"><title>ORDEM — Gestão gastronômica</title>
<style>
:root{--ink:#172321;--muted:#78827e;--line:#e8ece9;--paper:#f5f7f5;--white:#fff;--green:#176b52;--green2:#e8f3ee;--red:#d84e40;--amber:#e7a33e;--blue:#547c9d;--shadow:0 8px 30px #1c34200b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.side{background:#111c19;color:#e9f0ec;padding:22px 15px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}.brand{font-size:26px;font-weight:850;letter-spacing:-1.5px;padding:4px 12px}.brand i{color:#e16a55;font-style:normal}.branch{margin:0 8px;padding:12px;background:#1d2b26;border:1px solid #304039;border-radius:12px;color:#b9c8c0;font-size:11px}.branch strong{display:block;color:white;font-size:13px;margin-bottom:4px}.navlabel{font-size:10px;color:#809087;text-transform:uppercase;letter-spacing:1.5px;padding:0 12px;margin:6px 0}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b8c6bf;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:13px}.nav button.active,.nav button:hover{background:#263a32;color:white}.nav .ico{width:18px;text-align:center;color:#d98a76}.sidefoot{margin-top:auto;padding:12px;color:#91a098;font-size:11px;border-top:1px solid #2b3933}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:12px}.topright{display:flex;align-items:center;gap:12px}.live{color:var(--green);font-size:12px;font-weight:700}.avatar{width:34px;height:34px;border-radius:50%;background:#e8f1ec;color:var(--green);display:grid;place-items:center;font-weight:800}.content{padding:30px 32px 60px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:25px}.eyebrow{color:#bb594d;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.head h1{font-size:27px;letter-spacing:-.8px;margin:7px 0 5px}.sub{color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:10px 14px;font-weight:650;font-size:12px}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.dark{background:#182521;color:white;border-color:#182521}.btn.danger{color:#b84136;border-color:#f0d5d1}.btn:active{transform:translateY(1px)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow);min-width:0}.statlabel{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.statvalue{font-size:25px;font-weight:800;letter-spacing:-.7px;margin:9px 0 5px}.trend{font-size:10px;color:var(--green)}.cols{grid-template-columns:1.45fr 1fr}.cardtitle{font-size:14px;font-weight:800;margin:0 0 16px;display:flex;justify-content:space-between;align-items:center}.chart{height:210px;display:flex;align-items:end;gap:12px;padding:10px 5px 0;border-bottom:1px solid var(--line)}.barwrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:min(34px,80%);background:linear-gradient(180deg,#399273,#176b52);border-radius:6px 6px 2px 2px;min-height:5px}.bar.alt{background:#dce9e2}.barlabel{font-size:10px;color:var(--muted)}.legend{display:flex;gap:16px;color:var(--muted);font-size:10px;margin-top:13px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}.list{display:grid;gap:13px}.listrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.left{display:flex;align-items:center;gap:10px;min-width:0}.thumb{width:38px;height:38px;border-radius:10px;background:#f1f4f1;display:grid;place-items:center;font-size:20px;flex:none}.rowname{font-size:12px;font-weight:700}.rowmeta{font-size:10px;color:var(--muted);margin-top:3px}.money{font-weight:750;font-size:12px;white-space:nowrap}.pill{font-size:10px;padding:5px 8px;border-radius:20px;background:#eef4f0;color:#39745d;font-weight:700;white-space:nowrap}.pill.warn{background:#fff4e2;color:#a56a19}.pill.red{background:#fff0ed;color:#b34c3d}.section{margin-top:18px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:11px 9px;border-bottom:1px solid var(--line)}.table td{padding:13px 9px;border-bottom:1px solid #f0f2f0;font-size:12px}.table tr:last-child td{border-bottom:0}.tablewrap{overflow:auto}.table td:last-child{text-align:right}.table th:last-child{text-align:right}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.tile{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;gap:11px;align-items:center}.tile .thumb{width:42px;height:42px}.tile strong{display:block;font-size:12px}.tile small{color:var(--muted);font-size:10px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.field{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 12px;min-width:0;color:var(--ink)}.field.search{min-width:220px;flex:1}.tablesgrid{grid-template-columns:repeat(5,minmax(0,1fr))}.tabletile{background:white;border:1px solid var(--line);border-radius:13px;padding:15px;text-align:left;min-height:115px;display:flex;flex-direction:column;justify-content:space-between}.tabletile.occupied{border-color:#edc7bd;background:#fffaf8}.tabletile .number{font-size:19px;font-weight:800}.tabletile small{color:var(--muted)}.tabletile .state{font-size:10px;font-weight:700;color:var(--green)}.tabletile.occupied .state{color:#b44e3f}.kds{grid-template-columns:repeat(3,minmax(0,1fr))}.kcol{background:#edf1ee;border-radius:13px;padding:13px;min-height:250px}.kcol h3{font-size:12px;margin:0 0 12px}.ticket{background:white;border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:10px}.ticket strong{font-size:12px}.ticket p{font-size:11px;color:var(--muted);line-height:1.5}.ticketfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}.menuitems{grid-template-columns:repeat(3,minmax(0,1fr))}.product{overflow:hidden;padding:0}.product .photo{height:105px;background:linear-gradient(135deg,#e8eee9,#f7eee7);display:grid;place-items:center;font-size:42px}.product .details{padding:12px}.product h3{font-size:12px;margin:0 0 5px}.product small{color:var(--muted)}.product .price{font-weight:800;margin-top:10px}.progress{height:7px;border-radius:10px;background:#edf0ed;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:10px}.mobilebar{display:none}.modalback{position:fixed;inset:0;background:#101a18a8;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}.modal{width:min(520px,100%);background:white;border-radius:16px;padding:22px;box-shadow:0 25px 90px #0003}.modal h2{margin:0 0 5px;font-size:20px}.modal p{color:var(--muted);font-size:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:16px 0}.formgrid label{font-size:11px;color:var(--muted);display:grid;gap:6px}.formgrid .wide{grid-column:1/-1}.modalactions{display:flex;justify-content:flex-end;gap:8px}.empty{text-align:center;padding:30px;color:var(--muted);font-size:12px}.hide{display:none!important}
@media(max-width:1050px){.app{grid-template-columns:210px 1fr}.content{padding:24px 20px}.stats{grid-template-columns:repeat(2,1fr)}.tablesgrid{grid-template-columns:repeat(4,1fr)}.tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.app{display:block}.side{display:none}.top{height:58px;padding:0 16px}.crumb{font-size:11px}.content{padding:22px 14px 90px}.head{display:block}.head h1{font-size:24px}.actions{margin-top:15px}.stats{gap:10px}.card{padding:14px;border-radius:12px}.statvalue{font-size:21px}.cols{grid-template-columns:1fr}.chart{height:170px}.tablesgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tabletile{min-height:105px;padding:12px}.kds{grid-template-columns:1fr}.menuitems{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:1fr 1fr}.table{min-width:570px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111c19;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10;justify-content:space-around}.mobilebar button{border:0;background:none;color:#b9c8c0;font-size:9px;display:grid;gap:4px;justify-items:center}.mobilebar button.active{color:white}.mobilebar span{font-size:17px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">ordem<i>.</i></div>
<div class="branch"><strong>Restaurante ORDEM</strong>Unidade principal · Operação</div>
<div><div class="navlabel">Operação</div><nav class="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span>Visão geral</button>
<button data-page="tables"><span class="ico">▤</span>Mesas e comandas</button>
<button data-page="orders"><span class="ico">＋</span>Garçom / pedidos</button>
<button data-page="kitchen"><span class="ico">♨</span>Cozinha KDS</button>
<button data-page="menu"><span class="ico">◫</span>Cardápio digital</button>
</nav></div>
<div><div class="navlabel">Gestão</div><nav class="nav">
<button data-page="inventory"><span class="ico">▣</span>Estoque e CMV</button>
<button data-page="finance"><span class="ico">◉</span>Financeiro / DRE</button>
<button data-page="reports"><span class="ico">▥</span>Relatórios</button>
</nav></div>
<div class="sidefoot">ORDEM OS · Ambiente de demonstração<br>Dados salvos neste navegador</div>
</aside>
<main class="main">
<header class="top"><div class="crumb">Restaurante / <strong id="crumb">Visão geral</strong></div><div class="topright"><span class="live">● Ambiente ativo</span><span class="avatar">OR</span></div></header>
<div class="content" id="view"></div>
</main>
</div>
<nav class="mobilebar">
<button data-page="dashboard" class="active"><span>▦</span>Início</button><button data-page="tables"><span>▤</span>Mesas</button><button data-page="orders"><span>＋</span>Pedido</button><button data-page="kitchen"><span>♨</span>Cozinha</button><button data-page="finance"><span>◉</span>Financeiro</button>
</nav>
<div class="modalback" id="modal"><div class="modal" id="modalbody"></div></div>
<script>
const seedProducts=[
{id:1,name:"Picanha na brasa",cat:"Pratos principais",price:79.9,cost:31.5,stock:18,emoji:"🥩"},
{id:2,name:"Espeto misto",cat:"Espetos",price:29.9,cost:11.2,stock:32,emoji:"🍢"},
{id:3,name:"Frango crocante",cat:"Pratos principais",price:36.9,cost:13.8,stock:21,emoji:"🍗"},
{id:4,name:"Batata rústica",cat:"Acompanhamentos",price:19.9,cost:6.4,stock:40,emoji:"🍟"},
{id:5,name:"Refrigerante lata",cat:"Bebidas",price:6.5,cost:2.4,stock:64,emoji:"🥤"},
{id:6,name:"Suco natural",cat:"Bebidas",price:9.9,cost:3.1,stock:25,emoji:"🧃"},
{id:7,name:"Pudim da casa",cat:"Sobremesas",price:12.9,cost:4.2,stock:14,emoji:"🍮"},
{id:8,name:"Pão de alho",cat:"Acompanhamentos",price:14.9,cost:5.5,stock:27,emoji:"🥖"}
];
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem("ordem_"+k))??d}catch{return d}};
let products=load("products",seedProducts), tables=load("tables",Array.from({length:16},(_,i)=>({id:i+1,status:"Livre",items:[],total:0}))), orders=load("orders",[]), movements=load("movements",[]);
let page="dashboard",filter="Todos";
const money=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const save=()=>{localStorage.setItem("ordem_products",JSON.stringify(products));localStorage.setItem("ordem_tables",JSON.stringify(tables));localStorage.setItem("ordem_orders",JSON.stringify(orders));localStorage.setItem("ordem_movements",JSON.stringify(movements))};
const paid=orders.filter(o=>o.status==="Pago").reduce((s,o)=>s+o.total,0);
const open=orders.filter(o=>o.status!=="Pago"&&o.status!=="Cancelado");
const todaySales=paid;
const names={dashboard:"Visão geral",tables:"Mesas e comandas",orders:"Garçom / pedidos",kitchen:"Cozinha KDS",menu:"Cardápio digital",inventory:"Estoque e CMV",finance:"Financeiro / DRE",reports:"Relatórios"};
function go(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render();window.scrollTo(0,0)}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function header(kicker,title,desc,action=""){return '<div class="head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><div class="sub">'+desc+'</div></div><div class="actions">'+action+'</div></div>'}
function btn(text,fn,kind=""){return '<button class="btn '+kind+'" onclick="'+fn+'">'+text+'</button>'}
function stat(label,value,foot,trend=""){return '<div class="card"><div class="statlabel">'+label+'<span>'+trend+'</span></div><div class="statvalue">'+value+'</div><div class="trend">'+foot+'</div></div>'}
function render(){document.getElementById("crumb").textContent=names[page];let v=document.getElementById("view");if(page==="dashboard")v.innerHTML=dashboard();if(page==="tables")v.innerHTML=tablePage();if(page==="orders")v.innerHTML=orderPage();if(page==="kitchen")v.innerHTML=kitchenPage();if(page==="menu")v.innerHTML=menuPage();if(page==="inventory")v.innerHTML=inventoryPage();if(page==="finance")v.innerHTML=financePage();if(page==="reports")v.innerHTML=reportsPage()}
function dashboard(){let total=tables.filter(t=>t.status!=="Livre").length;let recent=orders.slice(-5).reverse();let bars=[32,48,40,66,54,82,62];return header("Central de operações","Visão geral","Acompanhe o desempenho e a operação do restaurante.",btn("＋ Novo pedido","newOrder()","primary"))+
'<div class="grid stats">'+stat("Vendas recebidas",money(paid),"Pedidos pagos","↗") +stat("Pedidos em aberto",open.length,"Em atendimento ou produção","●")+stat("Mesas ocupadas",total+" / "+tables.length,"Ocupação atual","◉")+stat("Em preparo",orders.filter(o=>o.status==="Preparando").length,"Fila da cozinha","♨")+'</div>'+
'<div class="grid cols"><section class="card"><h2 class="cardtitle">Movimento da operação <span class="pill">Últimos 7 dias</span></h2><div class="chart">'+bars.map((n,i)=>'<div class="barwrap"><div class="bar" style="height:'+n+'%"></div><span class="barlabel">'+["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"][i]+'</span></div>').join("")+'</div><div class="legend"><span><i class="dot"></i>Vendas demonstrativas</span><span>Dados locais da sessão</span></div></section>'+
'<section class="card"><h2 class="cardtitle">Produtos em destaque <span class="sub">Cardápio</span></h2><div class="list">'+products.slice(0,4).map(p=>'<div class="listrow"><div class="left"><div class="thumb">'+p.emoji+'</div><div><div class="rowname">'+p.name+'</div><div class="rowmeta">'+p.cat+'</div></div></div><div class="money">'+money(p.price)+'</div></div>').join("")+'</div></section></div>'+
'<section class="card section"><h2 class="cardtitle">Pedidos recentes '+btn("Ver pedidos","go('orders')")+'</h2>'+(recent.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Pedido</th><th>Origem</th><th>Itens</th><th>Status</th><th>Total</th></tr></thead><tbody>'+recent.map(o=>'<tr><td>#'+o.id+'</td><td>'+o.origin+'</td><td>'+o.items.length+' itens</td><td><span class="pill '+(o.status==="Pago"?"":"warn")+'">'+o.status+'</span></td><td>'+money(o.total)+'</td></tr>').join("")+'</tbody></table></div>':'<div class="empty">Nenhum pedido registrado ainda. Inicie um pedido para movimentar a operação.</div>')+'</section>'+
'<div class="grid tiles section"><div class="tile"><div class="thumb">▤</div><div><strong>Mapa de mesas</strong><small>Comandas e ocupação</small></div></div><div class="tile"><div class="thumb">♨</div><div><strong>Cozinha KDS</strong><small>Fila de produção</small></div></div><div class="tile"><div class="thumb">▣</div><div><strong>Estoque e CMV</strong><small>Custos e insumos</small></div></div><div class="tile"><div class="thumb">◉</div><div><strong>Financeiro</strong><small>Caixa e resultado</small></div></div></div>'}
function tablePage(){return header("Salão e atendimento","Mesas e comandas","Acompanhe ocupação, consumo e fechamento por mesa.",btn("＋ Abrir comanda","newOrder()","primary"))+
'<div class="toolbar"><span class="pill">● Livre</span><span class="pill warn">● Ocupada</span><span class="sub" style="padding:5px">Selecione uma mesa para ver detalhes</span></div><div class="grid tablesgrid">'+tables.map(t=>'<button class="tabletile '+(t.status!=="Livre"?"occupied":"")+'" onclick="tableDetail('+t.id+')"><span class="number">Mesa '+String(t.id).padStart(2,"0")+'</span><small>'+(t.status==="Livre"?"Disponível":t.items.length+" itens · "+money(t.total))+'</small><span class="state">'+t.status+'</span></button>').join("")+'</div>'}
function orderPage(){return header("Atendimento","Lançamento de pedidos","Registre pedidos por mesa e envie os itens para a cozinha.",btn("＋ Novo pedido","newOrder()","primary"))+
'<section class="card"><h2 class="cardtitle">Pedidos em andamento <span class="pill">'+open.length+' ativos</span></h2>'+(open.length?'<div class="tablewrap"><table class="table"><thead><tr><th>Pedido</th><th>Mesa</th><th>Itens</th><th>Status</th><th>Total</th><th>Ação</th></tr></thead><tbody>'+open.map(o=>'<tr><td>#'+o.id+'</td><td>'+o.origin+'</td><td>'+o.items.map(i=>i.qty+"× "+i.name).join(", ")+'</td><td><span class="pill warn">'+o.status+'</span></td><td>'+money(o.total)+'</td><td><button class="btn" onclick="advance('+o.id+')">Avançar</button></td></tr>').join("")+'</tbody></table></div>':'<div class="empty">Nenhum pedido em andamento.</div>')+'</section>'}
function kitchenPage(){let groups=[["Recebido","Recebido"],["Preparando","Preparando"],["Pronto","Pronto"]];return header("Produção","Cozinha · KDS","Painel de produção por etapa, com atualização dos pedidos.",'<span class="pill">Atualização local</span>')+
'<div class="grid kds">'+groups.map(([title,status])=>'<section class="kcol"><h3>'+title+' · '+orders.filter(o=>o.status===status).length+'</h3>'+orders.filter(o=>o.status===status).map(o=>'<article class="ticket"><strong>Pedido #'+o.id+' · '+o.origin+'</strong><p>'+o.items.map(i=>i.qty+'× '+i.name+(i.note?' — '+i.note:'')).join("<br>")+'</p><div class="ticketfoot"><span class="rowmeta">'+new Date(o.time).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+'</span><button class="btn" onclick="advance('+o.id+')">'+(status==="Recebido"?"Iniciar preparo":status==="Preparando"?"Marcar pronto":"Concluir")+'</button></div></article>').join("")+'</section>').join("")+'</div>'}
function menuPage(){return header("Experiência do cliente","Cardápio digital","Catálogo visual de produtos. Pedidos de demonstração podem ser lançados no salão.",btn("＋ Adicionar produto","productModal()","primary"))+
'<div class="toolbar"><input class="field search" id="menusearch" placeholder="Buscar prato ou bebida..." oninput="searchMenu()"><select class="field" id="menucat" onchange="searchMenu()"><option>Todos</option>'+[...new Set(products.map(p=>p.cat))].map(c=>'<option>'+c+'</option>').join("")+'</select></div><div class="grid menuitems" id="menugrid">'+productCards(products)+'</div>'}
function productCards(items){return items.map(p=>'<article class="card product"><div class="photo">'+p.emoji+'</div><div class="details"><h3>'+p.name+'</h3><small>'+p.cat+'</small><div class="price">'+money(p.price)+'</div><div class="rowmeta">CMV estimado '+Math.round(p.cost/p.price*100)+'%</div></div></article>').join("")}
function searchMenu(){let q=document.getElementById("menusearch").value.toLowerCase(),c=document.getElementById("menucat").value;document.getElementById("menugrid").innerHTML=productCards(products.filter(p=>(p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q))&&(c==="Todos"||p.cat===c)))}
function inventoryPage(){return header("Suprimentos","Estoque e CMV","Controle demonstrativo de saldo, custo e margem por produto.",btn("＋ Novo item","productModal()","primary"))+
'<div class="grid stats">'+stat("Itens cadastrados",products.length,"Produtos no catálogo")+stat("Valor em estoque",money(products.reduce((s,p)=>s+p.stock*p.cost,0)),"Custo estimado")+stat("Estoque baixo",products.filter(p=>p.stock<15).length,"Atenção à reposição","!")+stat("CMV médio",Math.round(products.reduce((s,p)=>s+p.cost/p.price,0)/products.length*100)+"%","Custo sobre preço")+'</div>'+
'<section class="card"><h2 class="cardtitle">Posição de estoque</h2><div class="tablewrap"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Saldo</th><th>Custo unitário</th><th>Preço</th><th>CMV</th></tr></thead><tbody>'+products.map(p=>'<tr><td>'+p.emoji+' '+p.name+'</td><td>'+p.cat+'</td><td><span class="pill '+(p.stock<15?"red":"")+'">'+p.stock+' un.</span></td><td>'+money(p.cost)+'</td><td>'+money(p.price)+'</td><td>'+Math.round(p.cost/p.price*100)+'%</td></tr>').join("")+'</tbody></table></div></section>'}
function financePage(){let revenue=paid,cost=orders.filter(o=>o.status==="Pago").reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.cost*i.qty,0),0),gross=revenue-cost;return header("Gestão financeira","Financeiro e DRE","Resumo gerencial calculado a partir dos pedidos marcados como pagos.",'<span class="pill warn">Demonstração local</span>')+
'<div class="grid stats">'+stat("Receita bruta",money(revenue),"Pedidos pagos")+stat("CMV estimado",money(cost),"Custo dos itens vendidos")+stat("Resultado bruto",money(gross),"Receita menos CMV")+stat("Margem bruta",revenue?Math.round(gross/revenue*100)+"%":"0%","Antes das despesas")+'</div>'+
'<div class="grid cols"><section class="card"><h2 class="cardtitle">DRE simplificada</h2><div class="list">'+[['Receita operacional bruta',revenue],['(-) Custo das mercadorias',-cost],['Resultado bruto',gross],['(-) Despesas operacionais',0],['Resultado operacional estimado',gross]].map((x,i)=>'<div class="listrow"><span class="rowname">'+x[0]+'</span><strong class="money">'+money(x[1])+'</strong></div>').join("")+'</div></section><section class="card"><h2 class="cardtitle">Movimentações registradas</h2>'+(movements.length?'<div class="list">'+movements.slice(-6).reverse().map(m=>'<div class="listrow"><div><div class="rowname">'+m.label+'</div><div class="rowmeta">'+m.date+'</div></div><strong class="money">'+money(m.value)+'</strong></div>').join("")+'</div>':'<div class="empty">Nenhuma movimentação manual registrada.</div>')+btn("＋ Registrar despesa","expenseModal()","")+'</section></div><p class="rowmeta section">Este demonstrativo não substitui contabilidade, conciliação bancária ou DRE fiscal. Valores são calculados apenas com os dados lançados nesta demonstração.</p>'}
function reportsPage(){return header("Inteligência","Relatórios gerenciais","Indicadores calculados com os dados de demonstração registrados no navegador.",'<span class="pill">Visão gerencial</span>')+
'<div class="grid stats">'+stat("Ticket médio",orders.filter(o=>o.status==="Pago").length?money(paid/orders.filter(o=>o.status==="Pago").length):money(0),"Por pedido pago")+stat("Pedidos totais",orders.length,"Inclui pedidos em aberto")+stat("Itens no cardápio",products.length,"Produtos cadastrados")+stat("Taxa de ocupação",Math.round(tables.filter(t=>t.status!=="Livre").length/tables.length*100)+"%","Mesas ocupadas")+'</div><div class="grid cols"><section class="card"><h2 class="cardtitle">Mix de categorias</h2>'+[...new Set(products.map(p=>p.cat))].map(c=>{let n=products.filter(p=>p.cat===c).length;return '<div style="margin:14px 0"><div class="listrow"><span class="rowname">'+c+'</span><span class="rowmeta">'+n+' itens</span></div><div class="progress"><span style="width:'+(n/products.length*100)+'%"></span></div></div>'}).join("")+'</section><section class="card"><h2 class="cardtitle">Saúde do estoque</h2><div class="list">'+products.slice().sort((a,b)=>a.stock-b.stock).slice(0,5).map(p=>'<div class="listrow"><div class="left"><div class="thumb">'+p.emoji+'</div><div><div class="rowname">'+p.name+'</div><div class="rowmeta">Saldo atual</div></div></div><span class="pill '+(p.stock<15?"red":"")+'">'+p.stock+' un.</span></div>').join("")+'</div></section></div>'}
function showModal(html){document.getElementById("modalbody").innerHTML=html;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function newOrder(tableId=null){let opts=tables.map(t=>'<option value="'+t.id+'" '+(t.id===tableId?"selected":"")+' '+(t.status!=="Livre"&&t.id!==tableId?"disabled":"")+'>'+"Mesa "+t.id+(t.status!=="Livre"?" · ocupada":"")+'</option>').join("");showModal('<h2>Novo pedido</h2><p>Selecione a mesa e adicione itens ao pedido.</p><div class="formgrid"><label>Mesa<select class="field" id="orderTable">'+opts+'</select></label><label>Observação geral<input class="field" id="orderNote" placeholder="Ex.: sem cebola"></label><div class="wide"><strong>Itens do cardápio</strong><div class="list" style="margin-top:10px">'+products.map(p=>'<div class="listrow"><div class="left"><div class="thumb">'+p.emoji+'</div><div><div class="rowname">'+p.name+'</div><div class="rowmeta">'+money(p.price)+'</div></div></div><input class="field qty" type="number" min="0" max="20" value="0" data-id="'+p.id+'" style="width:70px"></div>').join("")+'</div></div></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveOrder()">Enviar pedido</button></div>')}
function saveOrder(){let id=Number(document.getElementById("orderTable").value),items=[...document.querySelectorAll(".qty")].map(el=>({p:products.find(p=>p.id===Number(el.dataset.id)),qty:Number(el.value)})).filter(x=>x.qty>0).map(x=>({id:x.p.id,name:x.p.name,qty:x.qty,price:x.p.price,cost:x.p.cost,note:document.getElementById("orderNote").value}));if(!items.length){alert("Adicione pelo menos um item.");return}let total=items.reduce((s,i)=>s+i.price*i.qty,0),order={id:Date.now().toString().slice(-6),origin:"Mesa "+id,table:id,items,total,status:"Recebido",time:new Date().toISOString()};orders.push(order);let t=tables.find(t=>t.id===id);t.status="Ocupada";t.items=items;t.total+=total;save();closeModal();render()}
function advance(id){let o=orders.find(o=>o.id===id);if(!o)return;let seq=["Recebido","Preparando","Pronto","Pago"];o.status=seq[Math.min(seq.indexOf(o.status)+1,3)];if(o.status==="Pago"){let t=tables.find(t=>t.id===o.table);if(t){t.status="Livre";t.items=[];t.total=0}}save();render()}
function tableDetail(id){let t=tables.find(t=>t.id===id),active=orders.filter(o=>o.table===id&&o.status!=="Pago"&&o.status!=="Cancelado");showModal('<h2>Mesa '+id+'</h2><p>'+t.status+' · '+active.length+' pedido(s) em aberto</p>'+(active.length?'<div class="list">'+active.map(o=>'<div class="listrow"><span class="rowname">Pedido #'+o.id+' · '+o.status+'</span><strong>'+money(o.total)+'</strong></div>').join("")+'</div>':'<p>Mesa sem consumo no momento.</p>')+'<div class="modalactions" style="margin-top:18px"><button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="closeModal();newOrder('+id+')">Adicionar pedido</button></div>')}
function productModal(){showModal('<h2>Novo produto</h2><p>Cadastre um item no catálogo demonstrativo.</p><div class="formgrid"><label class="wide">Nome<input id="pname" class="field" placeholder="Nome do produto"></label><label>Categoria<input id="pcat" class="field" placeholder="Ex.: Bebidas"></label><label>Emoji<input id="pemoji" class="field" value="🍽️"></label><label>Preço de venda<input id="pprice" class="field" type="number" step=".01"></label><label>Custo unitário<input id="pcost" class="field" type="number" step=".01"></label><label>Estoque inicial<input id="pstock" class="field" type="number" value="0"></label></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProduct()">Salvar produto</button></div>')}
function saveProduct(){let name=document.getElementById("pname").value.trim(),price=Number(document.getElementById("pprice").value),cost=Number(document.getElementById("pcost").value);if(!name||price<=0){alert("Informe nome e preço válido.");return}products.push({id:Date.now(),name,cat:document.getElementById("pcat").value||"Outros",emoji:document.getElementById("pemoji").value||"🍽️",price,cost,stock:Number(document.getElementById("pstock").value)||0});save();closeModal();render()}
function expenseModal(){showModal('<h2>Registrar despesa</h2><p>Lançamento manual no resumo local.</p><div class="formgrid"><label class="wide">Descrição<input id="expenseName" class="field" placeholder="Ex.: Compra de insumos"></label><label>Valor<input id="expenseValue" class="field" type="number" step=".01"></label></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveExpense()">Registrar</button></div>')}
function saveExpense(){let label=document.getElementById("expenseName").value.trim(),value=Number(document.getElementById("expenseValue").value);if(!label||value<=0){alert("Informe descrição e valor.");return}movements.push({label,value:-value,date:new Date().toLocaleDateString("pt-BR")});save();closeModal();render()}
render();
</script>
</body></html>
