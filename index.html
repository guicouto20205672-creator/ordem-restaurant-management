p:7px}.bar{width:min(34px,80%);border-radius:5px 5px 0 0;background:linear-gradient(#4a9c79,#176b50)}.baritem small{font-size:9px;color:var(--muted)}.poslayout{display:grid;grid-template-columns:minmax(0,1fr) 355px;gap:15px;align-items:start}.posleft{min-width:0}.posfilters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.search{flex:1;min-width:170px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:white}.catbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-size:11px;color:#64736b}.catbtn.active{background:var(--nav2);color:white;border-color:var(--nav2)}.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.prod{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;cursor:pointer;transition:.15s}.prod:hover{border-color:#9ab9a7;transform:translateY(-1px);box-shadow:var(--shadow)}.prodvisual{height:105px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#e8eee9,#f6eee7)}.prodbody{padding:11px}.prodbody strong{display:block;font-size:11px}.prodbody small{display:block;font-size:9px;color:var(--muted);margin-top:4px}.prodprice{font-size:12px;font-weight:850;margin-top:9px}.cart{position:sticky;top:80px;overflow:hidden}.carthead{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.carthead strong{font-size:14px}.cartbody{padding:14px;max-height:390px;overflow:auto}.cartrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #eff2ef}.cartrow strong{font-size:11px}.cartrow small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.qty{display:flex;align-items:center;gap:7px}.qty button{border:1px solid var(--line);background:white;border-radius:6px;width:24px;height:24px}.cartfoot{padding:14px;border-top:1px solid var(--line)}.totalrow{display:flex;justify-content:space-between;margin:6px 0;font-size:11px;color:var(--muted)}.totalrow.grand{font-size:17px;font-weight:850;color:var(--ink);margin:12px 0}.cartfoot .btn{width:100%;margin-top:7px}.select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px;font-size:11px;width:100%;margin-top:8px}.tablesgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.tabletile{background:white;border:1px solid var(--line);border-radius:11px;padding:14px;text-align:left;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}.tabletile.busy{background:#fff9f7;border-color:#ecc9c2}.tabletile strong{font-size:19px}.tabletile small{font-size:10px;color:var(--muted)}.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.kcol{background:#e9eeea;border-radius:12px;padding:12px;min-height:280px}.kcol h3{font-size:12px;margin:3px 2px 12px}.ticket{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px}.ticket strong{font-size:11px}.ticket p{font-size:10px;color:var(--muted);line-height:1.6}.ticketfoot{display:flex;align-items:center;justify-content:space-between;gap:7px}.ticketfoot .btn{padding:7px;font-size:10px}.stockgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stockitem{padding:14px}.stockitem strong{font-size:12px}.stockitem .progress{height:6px;background:#edf0ed;border-radius:9px;margin:12px 0 7px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.mobile{display:none}.modalbg{position:fixed;inset:0;background:#0b1713a8;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalbg.show{display:flex}.modal{background:white;border-radius:15px;padding:21px;width:min(480px,100%);box-shadow:0 25px 80px #0003}.modal h2{margin:0 0 5px;font-size:19px}.modal p{font-size:11px;color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:16px 0}.form label{font-size:10px;color:var(--muted);display:grid;gap:6px}.form inp @media(max-width:1050px){.shell{grid-template-columns:205px 1fr}.main{padding:22px 18px}.metrics{grid-template-columns:repeat(2,1fr)}.tablesgrid{grid-template-columns:repeat(4,1fr)}.poslayout{grid-template-columns:minmax(0,1fr) 315px}}
@media(max-width:720px){.shell{display:block}aside{display:none}.topbar{height:56px;padding:0 14px}.main{padding:19px 12px 86px}.pagehead{display:block}.pagehead .btn{margin-top:12px}.metrics{gap:8px}.metric{padding:12px}.metric strong{font-size:20px}.columns{grid-template-columns:1fr}.poslayout{grid-template-columns:1fr}.cart{position:static;order:2}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.prodvisual{height:85px}.tablesgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.kds{grid-template-columns:1fr}.stockgrid{grid-template-columns:1fr 1fr}.mobile{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#111b18;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:8}.mobile button{border:0;background:none;color:#b8c5be;font-size:9px;display:grid;gap:3px;justify-items:center}.mobile button span{font-size:17px}.mobile button.active{color:white}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}}
</style></head>
<body><div class="shell"><aside><div class="logo">ordem<b>.</b></div><div class="unit"><strong>ORDEM · Restaurante</strong>Unidade principal · Operação</div>
<div class="navcap">Operação</div><nav class="nav"><button class="active" data-view="pos"><span class="ico">▦</span>PDV · Frente de caixa</button><button data-view="tables"><span class="ico">▤</span>Mesas e comandas</button><button data-view="kitchen"><span class="ico">♨</span>Cozinha · KDS</button><button data-view="menu"><span class="ico">◫</span>Cardápio</button></nav>
<div class="navcap">Gestão</div><nav class="nav"><button data-view="dashboard"><span class="ico">▥</span>Visão gerencial</button><button data-view="stock"><span class="ico">▣</span>Estoque e fichas</button><button data-view="finance"><span class="ico">◉</span>Financeiro / DRE</button><button data-view="reports"><span class="ico">⌁</span>Relatórios</button></nav>
<div class="sidebottom">ORDEM MANAGEMENT SUITE<br>Ambiente demonstrativo · armazenamento local</div></aside>
<div class="workspace"><header class="topbar"><div class="path">Restaurante / <strong id="path">PDV · Frente de caixa</strong></div><div class="toptools"><span class="live">● Operação ativa</span><div class="user">OR</div></div></header><main class="main" id="screen"></main></div></div>
<nav class="mobile"><button class="active" data-view="pos"><span>▦</span>PDV</button><button data-view="tables"><span>▤</span>Mesas</button><button data-view="kitchen"><span>♨</span>Cozinha</button><button data-view="dashboard"><span>▥</span>Painel</button><button data-view="finance"><span>◉</span>Financeiro</button></nav>

<script>
const seed=[{id:1,name:"Picanha na brasa",cat:"Pratos",price:79.9,cost:31.5,stock:18,emoji:"🥩"},{id:2,name:"Espeto misto",cat:"Espetos",price:29.9,cost:11.2,stock:32,emoji:"🍢"},{id:3,name:"Frango crocante",cat:"Pratos",price:36.9,cost:13.8,stock:21,emoji:"🍗"},{id:4,name:"Batata rústica",cat:"Acompanhamentos",price:19.9,cost:6.4,stock:40,emoji:"🍟"},{id:5,name:"Refrigerante lata",cat:"Bebidas",price:6.5,cost:2.4,stock:64,emoji:"🥤"},{id:6,name:"Suco natural",cat:"Bebidas",price:9.9,cost:3.1,stock:25,emoji:"🧃"},{id:7,name:"Pudim da casa",cat:"Sobremesas",price:12.9,cost:4.2,stock:14,emoji:"🍮"},{id:8,name:"Pão de alho",cat:"Acompanhamentos",price:14.9,cost:5.5,stock:27,emoji:"🥖"},{id:9,name:"Costela barbecue",cat:"Pratos",price:64.9,cost:25,stock:12,emoji:"🍖"}];
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem("ordem_"+k))??d}catch{return d}},store=()=>{for(let [k,v] of Object.entries({products,orders,tables,expenses}))localStorage.setItem("ordem_"+k,JSON.stringify(v))};
let products=read("products",seed),orders=read("orders",[]),tables=read("tables",Array.from({length:20},(_,i)=>({id:i+1,status:"Livre",total:0}))),expenses=read("expenses",[]),view="pos",cat="Todos",query="",cart=[],chosenTable=1;
const fmt=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),active=()=>orders.filter(o=>!["Pago","Cancelado"].includes(o.status)),paid=()=>orders.filter(o=>o.status==="Pago"),sum=a=>a.reduce((s,x)=>s+x.total,0),labels={pos:"PDV · Frente de caixa",tables:"Mesas e comandas",kitchen:"Cozinha · KDS",menu:"Cardápio",dashboard:"Visão gerencial",stock:"Estoque e fichas",finance:"Financeiro / DRE",reports:"Relatórios"};
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));
function go(v){view=v;document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));render()}
function head(k,t,d,extra=""){return '<div class="pagehead"><div><div class="kicker">'+k+'</div><h1>'+t+'</h1><div class="desc">'+d+'</div></div>'+extra+'</div>'}
function btn(t,fn,cls=""){return '<button class="btn '+cls+'" onclick="'+fn+'">'+t+'</button>'}
function metric(l,v,s){return '<div class="panel metric"><label>'+l+'</label><strong>'+v+'</strong><small>'+s+'</small></div>'}
function render(){document.getElementById("path").textContent=labels[view];let s=document.getElementById("screen");s.innerHTML=({pos:posPage,tables:tablesPage,kitchen:kitchenPage,menu:menuPage,dashboard:dashboardPage,stock:stockPage,finance:financePage,reports:reportsPage})[view]()}
function posPage(){let list=products.filter(p=>(cat==="Todos"||p.cat===cat)&&(p.name.toLowerCase().includes(query.toLowerCase())));return head("Atendimento · PDV","Frente de caixa","Selecione os produtos, personalize o pedido e envie para produção.",btn("＋ Cadastrar produto","productModal()",""))+'<div class="poslayout"><section class="posleft"><div class="posfilters"><input class="search" placeholder="⌕  Buscar produto no cardápio..." value="'+query.replace(/"/g,"&quot;")+'" oninput="query=this.value;render()">'+["Todos",...new Set(products.map(p=>p.cat))].map(c=>'<button class="catbtn '+(cat===c?"active":"")+'" onclick="cat='+JSON.stringify(c)+';render()">'+c+'</button>').join("")+'</div><div class="products">'+list.map(p=>'<article class="prod" onclick="addCart('+p.id+')"><div class="prodvisual">'+p.emoji+'</div><div class="prodbody"><strong>'+p.name+'</strong><small>'+p.cat+' · '+p.stock+' em estoque</small><div class="prodprice">'+fmt(p.price)+'</div></div></article>').join("")+'</div></section><section class="panel cart"><div class="carthead"><strong>Comanda atual</strong><span class="tag">'+cart.reduce((s,x)=>s+x.qty,0)+' itens</span></div><div style="padding:0 14px"><select class="select" id="tableSelect" onchange="chosenTable=Number(this.value)">'+tables.map(t=>'<option value="'+t.id+'" '+(chosenTable===t.id?"selected":"")+'>'+("Mesa "+String(t.id).padStart(2,"0"))+(t.status==="Livre"?" · Livre":" · Ocupada")+'</option>').join("")+'</select></div><div class="cartbody">'+(cart.length?cart.map((x,i)=>'<div class="cartrow"><div><strong>'+x.name+'</strong><small>'+fmt(x.price)+' cada</small></div><div class="qty"><button onclick="changeQty('+i+',-1)">−</button><b>'+x.qty+'</b><button onclick="changeQty('+i+',1)">+</button></div></div>').join(""):'<div class="empty">Comanda vazia<br>Adicione produtos do cardápio.</div>')+'</div><div class="cartfoot"><div class="totalrow"><span>Subtotal</span><b>'+fmt(cart.reduce((s,x)=>s+x.price*x.qty,0))+'</b></div><div class="totalrow"><span>Desconto</span><span>R$ 0,00</span></div><div class="totalrow grand"><span>Total</span><span>'+fmt(cart.reduce((s,x)=>s+x.price*x.qty,0))+'</span></div><button class="btn primary" '+(!cart.length?"disabled":"")+' onclick="sendOrder()">Enviar para cozinha →</button><button class="btn" '+(!cart.length?"disabled":"")+' onclick="paymentModal()">Cobrar / fechar comanda</button></div></section></div>'}
function addCart(id){let p=products.find(p=>p.id===id),x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({...p,qty:1});render()}
function changeQty(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);render()}
function sendOrder(){let id=chosenTable,t=tables.find(t=>t.id===id);if(t.status!=="Livre"&&!confirm("Esta mesa já possui consumo. Adicionar novo pedido?"))return;let total=cart.reduce((s,x)=>s+x.price*x.qty,0),o={id:Date.now().toString().slice(-6),table:id,items:cart.map(x=>({...x})),total,status:"Recebido",time:new Date().toISOString()};orders.push(o);t.status="Ocupada";t.total+=total;cart=[];store();render();alert("Pedido #"+o.id+" enviado para a fila da cozinha.")}
function paymentModal(){if(!cart.length)return;let total=cart.reduce((s,x)=>s+x.price*x.qty,0);modal('<h2>Finalizar comanda</h2><p>Confirme o recebimento do pedido atual.</p><div class="form"><label class="wide">Forma de pagamento<select id="paymethod"><option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option></select></label><label class="wide">Valor total<input value="'+fmt(total)+'" disabled></label></div><div class="modalactions"><button class="btn" onclick="closeModal()">Voltar</button><button class="btn primary" onclick="finishDirect('+total+')">Confirmar pagamento</button></div>')}
function finishDirect(total){let id=chosenTable,t=tables.find(t=>t.id===id),o={id:Date.now().toString().slice(-6),table:id,items:cart.map(x=>({...x})),total,status:"Pago",method:document.getElementById("paymethod").value,time:new Date().toISOString()};orders.push(o);t.status="Livre";t.total=0;products.forEach(p=>{let q=cart.find(x=>x.id===p.id);if(q)p.stock=Math.max(0,p.stock-q.qty)});cart=[];store();closeModal();render()}
function tablesPage(){return head("Salão · Ocupação","Mapa de mesas","Visão do salão em tempo real nesta sessão. Selecione uma mesa para abrir sua comanda.",'<span class="tag">● Livre</span> <span class="tag orange">● Ocupada</span>')+'<div class="metrics">'+metric("Mesas disponíveis",tables.filter(t=>t.status==="Livre").length,"Prontas para atendimento")+metric("Mesas ocupadas",tables.filter(t=>t.status!=="Livre").length,"Com consumo aberto")+metric("Consumo em aberto",fmt(tables.reduce((s,t)=>s+t.total,0)),"Total nas mesas")+metric("Pedidos em produção",active().length,"Fila de atendimento")+'</div><div class="tablesgrid">'+tables.map(t=>'<button class="tabletile '+(t.status!=="Livre"?"busy":"")+'" onclick="tableModal('+t.id+')"><strong>Mesa '+String(t.id).padStart(2,"0")+'</strong><small>'+(t.status==="Livre"?"Disponível":fmt(t.total)+" em consumo")+'</small><span class="tag '+(t.status!=="Livre"?"orange":"")+'">'+t.status+'</span></button>').join("")+'</div>'}
function tableModal(id){chosenTable=id;let t=tables.find(t=>t.id===id),os=orders.filter(o=>o.table===id&&o.status!=="Pago");modal('<h2>Mesa '+id+'</h2><p>'+t.status+' · Consumo '+fmt(t.total)+'</p>'+(os.length?os.map(o=>'<div class="cartrow"><div><strong>Pedido #'+o.id+'</strong><small>'+o.items.map(i=>i.qty+"× "+i.name).join(", ")+'</small></div><span class="tag orange">'+o.status+'</span></div>').join(""):'<div class="empty">Nenhum pedido nesta mesa.</div>')+'<div class="modalactions"><button class="btn" onclick="closeModal()">Fechar</button><button class="btn primary" onclick="closeModal();go(\\'pos\\');render()">Abrir no PDV</button></div>')}
function kitchenPage(){return head("Produção · KDS","Painel da cozinha","Pedidos organizados por etapa. Avance cada ticket conforme a produção.",'<span class="tag">Atualização automática na tela</span>')+'<div class="kds">'+[["Recebido","Recebido"],["Em preparo","Preparando"],["Pronto para servir","Pronto"]].map(([title,status])=>'<section class="kcol"><h3>'+title+' · '+orders.filter(o=>o.status===status).length+'</h3>'+orders.filter(o=>o.status===status).map(o=>'<article class="ticket"><strong>Pedido #'+o.id+' · Mesa '+o.table+'</strong><p>'+o.items.map(i=>i.qty+"× "+i.name).join("<br>")+'</p><div class="ticketfoot"><small>'+new Date(o.time).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+'</small><button class="btn" onclick="advance('+o.id+')">'+(status==="Recebido"?"Iniciar":status==="Preparando"?"Marcar pronto":"Concluir")+'</button></div></article>').join("")+'</section>').join("")+'</div>'}
function advance(id){let o=orders.find(o=>o.id===id);if(!o)return;o.status=({Recebido:"Preparando",Preparando:"Pronto",Pronto:"Pago"})[o.status]||o.status;if(o.status==="Pago"){let t=tables.find(t=>t.id===o.table);if(t){t.status="Livre";t.total=0}}store();render()}
function menuPage(){return head("Catálogo · Produtos","Cardápio do restaurante","Gerencie produtos, categorias, preços de venda e custo estimado.",btn("＋ Novo produto","productModal()","primary"))+'<div class="products">'+products.map(p=>'<article class="prod"><div class="prodvisual">'+p.emoji+'</div><div class="prodbody"><strong>'+p.name+'</strong><small>'+p.cat+'</small><div class="prodprice">'+fmt(p.price)+'</div><small>CMV '+Math.round(p.cost/p.price*100)+'% · Estoque '+p.stock+'</small></div></article>').join("")+'</div>'}
function dashboardPage(){let revenue=sum(paid()),cost=paid().reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.cost*i.qty,0),0);return head("Inteligência de negócio","Visão gerencial","Indicadores da operação e desempenho comercial.",btn("＋ Abrir PDV","go(\\'pos\\')","primary"))+'<div class="metrics">'+metric("Receita recebida",fmt(revenue),"Pedidos pagos")+metric("Pedidos ativos",active().length,"Em atendimento / produção")+metric("Ticket médio",paid().length?fmt(revenue/paid().length):fmt(0),"Por pedido pago")+metric("Margem bruta estimada",revenue?Math.round((revenue-cost)/revenue*100)+"%":"0%","Após custo dos itens")+'</div><div class="columns"><section class="panel panelpad"><h2 class="paneltitle">Movimento de vendas <span class="tag">Sessão atual</span></h2><div class="bargraph">'+[25,38,31,55,44,78,63].map((n,i)=>'<div class="baritem"><div class="bar" style="height:'+n+'%"></div><small>'+["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"][i]+'</small></div>').join("")+'</div></section><section class="panel panelpad"><h2 class="paneltitle">Pedidos recentes</h2>'+(orders.length?orders.slice(-5).reverse().map(o=>'<div class="cartrow"><div><strong>#'+o.id+' · Mesa '+o.table+'</strong><small>'+o.items.length+' itens · '+o.status+'</small></div><b>'+fmt(o.total)+'</b></div>').join(""):'<div class="empty">Nenhum pedido lançado.</div>')+'</section></div>'}
function stockPage(){return head("Suprimentos · Custos","Estoque e fichas técnicas","Saldos, custos unitários e CMV estimado dos produtos.",btn("＋ Novo item","productModal()","primary"))+'<div class="stockgrid">'+products.map(p=>'<section class="panel stockitem"><strong>'+p.emoji+' '+p.name+'</strong><div class="desc">'+p.cat+'</div><div class="progress"><span style="width:'+Math.min(100,p.stock/50*100)+'%"></span></div><div style="display:flex;justify-content:space-between;font-size:10px"><span>'+p.stock+' unidades</span><b>CMV '+Math.round(p.cost/p.price*100)+'%</b></div><div class="desc" style="margin-top:7px">Custo '+fmt(p.cost)+' · Venda '+fmt(p.price)+'</div></section>').join("")+'</div>'}
function financePage(){let rev=sum(paid()),cost=paid().reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.cost*i.qty,0),0),ex=expenses.reduce((s,e)=>s+e.value,0);return head("Controladoria","Financeiro e DRE","Resumo de vendas, custo de mercadoria e despesas lançadas.",btn("＋ Registrar despesa","expenseModal()","primary"))+'<div class="metrics">'+metric("Receita bruta",fmt(rev),"Pedidos pagos")+metric("CMV",fmt(cost),"Custo estimado dos itens")+metric("Despesas",fmt(ex),"Lançamentos manuais")+metric("Resultado estimado",fmt(rev-cost-ex),"Após CMV e despesas")+'</div><section class="panel panelpad"><h2 class="paneltitle">Demonstração de resultado simplificada</h2>'+[['Receita operacional',rev],['(-) Custo de mercadorias',-cost],['(-) Despesas lançadas',-ex],['Resultado estimado',rev-cost-ex]].map(x=>'<div class="cartrow" style="display:flex;justify-content:space-between"><span>'+x[0]+'</span><b>'+fmt(x[1])+'</b></div>').join("")+'</section><p class="desc" style="margin-top:13px">Demonstrativo gerencial de demonstração. Não substitui escrituração contábil ou conciliação bancária.</p>'}
function reportsPage(){return head("Análise operacional","Relatórios","Indicadores calculados com os registros desta sessão.")+'<div class="metrics">'+metric("Produtos cadastrados",products.length,"Catálogo atual")+metric("Valor em estoque",fmt(products.reduce((s,p)=>s+p.stock*p.cost,0)),"Custo estimado")+metric("Mesas ocupadas",tables.filter(t=>t.status!=="Livre").length,"Ocupação atual")+metric("Pedidos registrados",orders.length,"Histórico local")+'</div><section class="panel panelpad"><h2 class="paneltitle">Produtos com menor saldo</h2>'+products.slice().sort((a,b)=>a.stock-b.stock).slice(0,6).map(p=>'<div class="cartrow" style="display:flex;justify-content:space-between"><span>'+p.emoji+' '+p.name+'</span><span class="tag '+(p.stock<15?"red":"")+'">'+p.stock+' unidades</span></div>').join("")+'</section>'}
function modal(content){document.getElementById("modalcontent").innerHTML=content;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function productModal(){modal('<h2>Cadastrar produto</h2><p>Adicione um item ao catálogo e ao controle de estoque.</p><div class="form"><label class="wide">Nome<input id="pn" placeholder="Nome do produto"></label><label>Categoria<input id="pc" placeholder="Ex.: Bebidas"></label><label>Ícone<input id="pe" value="🍽️"></label><label>Preço de venda<input id="pp" type="number" step=".01"></label><label>Custo unitário<input id="pk" type="number" step=".01"></label><label>Estoque inicial<input id="ps" type="number" value="0"></label></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveProduct()">Salvar produto</button></div>')}
function saveProduct(){let name=document.getElementById("pn").value.trim(),price=Number(document.getElementById("pp").value);if(!name||price<=0){alert("Informe o nome e um preço válido.");return}products.push({id:Date.now(),name,cat:document.getElementById("pc").value||"Outros",emoji:document.getElementById("pe").value||"🍽️",price,cost:Number(document.getElementById("pk").value)||0,stock:Number(document.getElementById("ps").value)||0});store();closeModal();render()}
function expenseModal(){modal('<h2>Registrar despesa</h2><p>Lance uma despesa para o demonstrativo financeiro.</p><div class="form"><label class="wide">Descrição<input id="en" placeholder="Ex.: Compra de insumos"></label><label class="wide">Valor<input id="ev" type="number" step=".01"></label></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveExpense()">Registrar</button></div>')}
function saveExpense(){let name=document.getElementById("en").value.trim(),value=Number(document.getElementById("ev").value);if(!name||value<=0){alert("Preencha a descrição e o valor.");return}expenses.push({name,value});store();closeModal();render()}
document.getElementById("modal").addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});render();
</script></body></html>
